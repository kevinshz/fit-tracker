server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/kevinshz/config-fit-tracker.git
          default-label: main

# Eureka va en la RAÍZ del archivo, no dentro de 'spring'
eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info" # Exponemos lo básico para Docker y Eureka
  endpoint:
    health:
      show-details: always # Útil para debug, pero opcional en producción
