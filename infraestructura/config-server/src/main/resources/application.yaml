server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          # URI y rama del repositorio de configuracion: solo via variables de entorno
          # (docker/.env para el stack; export en IDE). Sin default: falla rapido si falta.
          uri: ${CONFIG_GIT_URI}
          default-label: ${CONFIG_GIT_BRANCH:main}
          # Clona al arrancar: si el repo no es accesible, el servidor no arranca
          # y el healthcheck de Docker bloquea el stack (nunca ocultar un Config Server caido).
          clone-on-start: true

# Eureka con placeholder: Docker pasa EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
# (discovery-server:8761); en IDE/local usa localhost:8761.
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info" # Exponemos lo basico para Docker y Eureka
  endpoint:
    health:
      show-details: always # Util para debug, pero opcional en produccion
