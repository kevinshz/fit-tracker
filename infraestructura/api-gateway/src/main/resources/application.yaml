spring:
  application:
    name: api-gateway
  config:
    # Config centralizada en Config Server (rutas, CORS, springdoc, jwt, puerto).
    # optional: para tests sin Config Server; en Docker la disponibilidad la garantizan
    # depends_on/healthchecks (nunca usar optional para ocultar un Config Server caido).
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
