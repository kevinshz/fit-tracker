spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: false
  cloud:
    config:
      enabled: false

eureka:
  client:
    enabled: false

feign:
  circuitbreaker:
    enabled: false
  client:
    config:
      default:
        connect-timeout: 1000
        read-timeout: 1000

fit-tracker:
  progression:
    hypertrophy:
      low: 8
      high: 12
      rir-low: 1
      rir-high: 3
    strength:
      stable-sessions: 2
      rir-min: 1
