spring:
  application:
    name: calculator-service
  config:
    # Config centralizada en Config Server (puerto). Eureka viene del application.yaml global.
    # optional: para tests sin Config Server; en Docker la disponibilidad la garantizan
    # depends_on/healthchecks (nunca usar optional para ocultar un Config Server caido).
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
